<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            max-width: 1000px;
            margin: 25px auto;
        }

        .card {
            padding: 12px;
            background: white;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 7px;
        }

        .gray { filter: grayscale(100%); }
        .blur { filter: blur(4px); }
        .bright { filter: brightness(140%); }
        .contrast { filter: contrast(180%); }
        .saturate { filter: saturate(250%); }
        .sepia { filter: sepia(100%); }
        .invert { filter: invert(100%); }
        .shadow { filter: drop-shadow(6px 6px 8px #555); }
    </style>
</head>
<body>
    <h1>CSS Image Filter Gallery</h1>
    <p>Explore how CSS filters change the appearance of an image.</p>

    <div class="gallery">
        <div class="card"><h3>Grayscale</h3><img class="gray" src="https://picsum.photos/id/1025/500/350" alt="Grayscale filter"></div>
        <div class="card"><h3>Blur</h3><img class="blur" src="https://picsum.photos/id/1025/500/350" alt="Blur filter"></div>
        <div class="card"><h3>Brightness</h3><img class="bright" src="https://picsum.photos/id/1025/500/350" alt="Brightness filter"></div>
        <div class="card"><h3>Contrast</h3><img class="contrast" src="https://picsum.photos/id/1025/500/350" alt="Contrast filter"></div>
        <div class="card"><h3>Saturate</h3><img class="saturate" src="https://picsum.photos/id/1025/500/350" alt="Saturate filter"></div>
        <div class="card"><h3>Sepia</h3><img class="sepia" src="https://picsum.photos/id/1025/500/350" alt="Sepia filter"></div>
        <div class="card"><h3>Invert</h3><img class="invert" src="https://picsum.photos/id/1025/500/350" alt="Invert filter"></div>
        <div class="card"><h3>Drop Shadow</h3><img class="shadow" src="https://picsum.photos/id/1025/500/350" alt="Drop shadow filter"></div>
    </div>
</body>
</html>
