<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CookBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf2;
        }

        header, footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 30px;
            background: #ffcc80;
        }

        header h1 {
            color: #8b2500;
            margin: 0;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #542800;
            font-weight: bold;
        }

        nav a:hover {
            color: #e65100;
        }

        main {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            color: #a84300;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #e65c00;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #b84300;
        }

        footer {
            color: #542800;
        }
    </style>
</head>

<body>

    <header>
        <h1>CookBook</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="recipe.html">Recipes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>

        <p>Have a question or suggestion? Send us a message.</p>

        <form onsubmit="alert('Thank you for contacting CookBook!'); return false;">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message"
                      rows="5" placeholder="Enter your message"
                      required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <h3>Contact Information</h3>
        <p>Email: cookbook@example.com</p>
        <p>Website: www.cookbook.com</p>
    </main>

    <footer>
        <h3>Happy Cooking!</h3>
        <p>www.cookbook.com &copy; 2026</p>
    </footer>

</body>
</html>
