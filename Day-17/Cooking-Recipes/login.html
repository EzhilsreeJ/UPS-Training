<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CookBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf2;
        }

        header, footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 30px;
            background: #ffcc80;
        }

        header h1 {
            color: #8b2500;
            margin: 0;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #542800;
            font-weight: bold;
        }

        nav a:hover {
            color: #e65100;
        }

        .login-box {
            width: 350px;
            max-width: 90%;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            text-align: center;
            color: #a84300;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e65c00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #b84300;
        }

        .login-box p {
            text-align: center;
        }

        footer {
            color: #542800;
        }
    </style>
</head>

<body>

    <header>
        <h1>CookBook</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="recipe.html">Recipes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="login-box">

        <h2>Login</h2>

        <form onsubmit="alert('Login form submitted!'); return false;">

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

    <footer>
        <h3>Happy Cooking!</h3>
        <p>www.cookbook.com &copy; 2026</p>
    </footer>

</body>
</html>
