<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Multimedia</title>
</head>
<body>

    <h1>HTML Multimedia Elements</h1>

    <h2>Video Example</h2>

    <video width="500" height="300" controls muted>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Video with Autoplay and Loop</h2>

    <video width="500" height="300" controls autoplay muted loop>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Audio Example</h2>

    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>

    <h2>YouTube Video Example</h2>

    <iframe
        width="500"
        height="300"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video"
        allowfullscreen>
    </iframe>

    <br><br>
    <a href="../home.html">Back to Home</a>

</body>
</html>
