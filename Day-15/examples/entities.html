<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Entity</th>
            <th>Output</th>
            <th>Description</th>
        </tr>

        <tr>
            <td>&amp;nbsp;</td>
            <td>&nbsp;</td>
            <td>Non-breaking space</td>
        </tr>

        <tr>
            <td>&amp;lt;</td>
            <td>&lt;</td>
            <td>Less than</td>
        </tr>

        <tr>
            <td>&amp;gt;</td>
            <td>&gt;</td>
            <td>Greater than</td>
        </tr>

        <tr>
            <td>&amp;amp;</td>
            <td>&amp;</td>
            <td>Ampersand</td>
        </tr>

        <tr>
            <td>&amp;quot;</td>
            <td>&quot;</td>
            <td>Double quotation mark</td>
        </tr>

        <tr>
            <td>&amp;apos;</td>
            <td>&apos;</td>
            <td>Apostrophe</td>
        </tr>

        <tr>
            <td>&amp;copy;</td>
            <td>&copy;</td>
            <td>Copyright symbol</td>
        </tr>

        <tr>
            <td>&amp;reg;</td>
            <td>&reg;</td>
            <td>Registered trademark</td>
        </tr>

        <tr>
            <td>&amp;euro;</td>
            <td>&euro;</td>
            <td>Euro</td>
        </tr>

        <tr>
            <td>&amp;pound;</td>
            <td>&pound;</td>
            <td>Pound</td>
        </tr>

        <tr>
            <td>&amp;yen;</td>
            <td>&yen;</td>
            <td>Yen</td>
        </tr>
    </table>

    <br>

</body>
</html>
